[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spmerton-sampleplan"
version = "0.1.0"
description = "按任务类型给出温度、top-p 与最大长度的建议并说明依据"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "spmerton" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://spmerton.github.io"
Repository = "https://github.com/spmerton/sampleplan"
Issues = "https://github.com/spmerton/sampleplan/issues"

[project.scripts]
sampleplan = "sampleplan:main"

[tool.setuptools]
py-modules = ["sampleplan"]
